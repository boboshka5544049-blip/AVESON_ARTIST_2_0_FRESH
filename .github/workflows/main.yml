    @Override public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(Color.rgb(3,5,12));home();}
    void shell(String name,boolean back){
        root=col();root.setBackgroundColor(BG);LinearLayout h=row();h.setPadding(d(18),d(14),d(18),d(8));
        if(back){TextView q=t("‹",38,WHITE,false);q.setGravity(Gravity.CENTER);q.setBackground(stroke(PANEL,Color.rgb(45,52,86),1,14));h.addView(q,lp(d(46),d(44)));q.setOnClickListener(v->home());gapH(h,10);}
        LinearLayout brand=col();brand.addView(t("AVESON",20,PURPLE,true));brand.addView(t("ARTIST",10,BLUE,true));h.addView(brand,new LinearLayout.LayoutParams(0,-2,1));
