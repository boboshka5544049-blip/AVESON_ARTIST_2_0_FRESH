        LinearLayout dc=card();dc.addView(label("RELEASE DATE"));gap(dc,7);LinearLayout dr=row();EditText date=edit("YYYY-MM-DD");dr.addView(date,new LinearLayout.LayoutParams(0,d(50),1));gapH(dr,8);Button cal=btn("CALENDAR",false);dr.addView(cal,lp(d(105),d(50)));cal.setOnClickListener(v->datePicker(date));dc.addView(dr);gap(dc,4);dc.addView(t("Past dates are blocked. Calendar or keyboard input.",11,MUTED,false));content.addView(dc);gap(content,9);upload("AUDIO","WAV / FLAC preferred • stereo master");upload("COVER","Square artwork • 3000 × 3000 preferred");field("Lyrics","Optional");field("Explicit content","Clean");
