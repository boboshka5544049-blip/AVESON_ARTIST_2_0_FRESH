    void releaseCard(String n,String state,String date,int ac){LinearLayout c=card();LinearLayout r=row();TextView art=t("♪",28,WHITE,true);art.setGravity(Gravity.CENTER);art.setBackground(g(ac,16));r.addView(art,lp(d(62),d(62)));gapH(r,12);LinearLayout inf=col();inf.addView(t(n,17,WHITE,true));gap(inf,3);inf.addView(t(state,12,ac,true));gap(inf,2);inf.addView(t("Release date: "+date,11,MUTED,false));r.addView(inf,new LinearLayout.LayoutParams(0,-2,1));r.addView(t("›",28,MUTED,false),lp(d(28),d(62)));c.addView(r);c.setOnClickListener(v->info("RELEASE DETAILS"));content.addView(c);gap(content,9);}
